# Tự động build và đưa web lên GitHub Pages (tiahere.com) mỗi khi có thay đổi trên nhánh main
name: Deploy tiahere.com

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions
  schedule:
    # Tự build lại mỗi ngày 2 lần (7:00 và 19:00 giờ Việt Nam) để cập nhật link chia sẻ sản phẩm/bài viết mới
    - cron: "0 0,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài thư viện
        run: npm install
      - name: Build
        run: npm run build
      - name: Tạo trang chia sẻ mạng xã hội (tiahere.com/p/... và /bai-viet/...)
        run: node scripts/share-pages.mjs
        continue-on-error: true
      - name: Giữ tên miền tiahere.com
        run: echo "tiahere.com" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
