    <!-- Google Analytics (chỉ đếm trên tiahere.com, không đếm khi chạy thử localhost) -->
    <script>
      (function () {
        if (location.hostname !== "tiahere.com" && location.hostname !== "www.tiahere.com") return;
        var GA_ID = "G-J838L8PHBT";
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", GA_ID, { send_page_view: false });

        // Gửi lượt xem mỗi khi đổi trang (link đẹp /p/... /bai-viet/... hoặc link dạng #...)
        // Ví dụ: /p/ten-san-pham/ giữ nguyên ; /#tai-lieu → /tai-lieu ; /#san-pham=abc → /san-pham/abc
        function pagePath() {
          var h = location.hash.replace(/^#\/?/, "");
          return h ? "/" + h.replace(/=/g, "/") : location.pathname;
        }
        var last = "", timer;
        function track() {
          clearTimeout(timer);
          timer = setTimeout(function () {
            var path = pagePath();
            if (path === last) return;
            last = path;
            gtag("event", "page_view", {
              page_location: location.origin + path,
              page_path: path,
              page_title: document.title
            });
          }, 500);
        }
        ["pushState", "replaceState"].forEach(function (k) {
          var orig = history[k];
          history[k] = function () { var r = orig.apply(this, arguments); track(); return r; };
        });
        window.addEventListener("hashchange", track);
        window.addEventListener("popstate", track);
        track();
      })();
    </script>
